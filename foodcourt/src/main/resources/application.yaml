server:
  port: 8080
spring:
  application:
    name: foodcourt
  cloud:
    compatibility-verifier:
      enabled: false
  datasource:
    url: jdbc:mysql://localhost:3306/ms_foodcourt?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQL8Dialect
    show-sql: true
security:
   jwt:
     secret: 9c9c48d57077710e8a8ec4a72f0c959fa11ea2c2e1073b7c7d39b4eefff5ddf8

ms-user:
  url: ${MS_USER_URL:http://localhost:8081}

ms-mensajeria:
  url: ${MS_MENSAJERIA_URL:http://localhost:8083}

ms-traceability:
  url: ${MS_TRAZABILITY_URL:http://localhost:8082}

roles:
